{{- if .Values.externalSecret.enabled }}
{{- if and (not .Values.externalSecret.data) (not .Values.externalSecret.dataFrom) }}
{{- fail "externalSecret needs data[] ({secretKey,remoteKey}) or dataFrom[] ({key}) when externalSecret.enabled is true" }}
{{- end }}
{{/* data[]: one k8s key per SM secret (staging/prod: 2 keys). dataFrom[].extract: pull EVERY
     property of ONE JSON SM secret into the k8s Secret (dev-all: many CONN_* keys, one secret). */}}
apiVersion: {{ .Values.esoApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appdb-data-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ default (include "appdb-data-api.secretStoreName" .) .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: {{ .Values.externalSecret.name }}
    creationPolicy: Owner
  {{- with .Values.externalSecret.data }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
  {{- end }}
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- range . }}
    - extract:
        key: {{ .key }}
    {{- end }}
  {{- end }}
{{- end }}
