{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appdb-data-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appdb-data-api.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.secretStore.create }}
    # IRSA for the SecretStore. The pod never mounts this token.
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required when secretStore.create is true" .Values.serviceAccount.roleArn | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
