{{- if .Values.secretStore.create }}
{{/* Namespaced: the IRSA trust policy pins the role to this namespace's ServiceAccount,
     so the namespace and the IAM policy are two independent boundaries. */}}
apiVersion: {{ .Values.esoApiVersion }}
kind: SecretStore
metadata:
  name: {{ include "appdb-data-api.secretStoreName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appdb-data-api.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretStore.region }}
      auth:
        jwt:
          # ESO mints a token for this SA and exchanges it via AssumeRoleWithWebIdentity.
          serviceAccountRef:
            name: {{ include "appdb-data-api.serviceAccountName" . }}
{{- end }}
