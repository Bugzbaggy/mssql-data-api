# Pulls the connection strings + JWT settings from AWS Secrets Manager into a k8s
# Secret, using the External Secrets Operator (ESO). The pod reads them via envFrom
# (see deployment.yaml). Nothing sensitive lives in git or in the image.
#
# Prereq: ESO installed, and a ClusterSecretStore named `aws-secretsmanager` wired to
# the account/region via IRSA. Create the underlying secrets first, e.g.:
#   aws secretsmanager create-secret --name appdb-data-api/CONN_ID_MSGDATA \
#     --secret-string 'Server=ag-id-lsnr,1433;Database=AppDb_Data;User ID=svc_dataapi;Password=<real>;ApplicationIntent=ReadOnly;MultiSubnetFailover=True;Encrypt=True;TrustServerCertificate=False;Application Name=appdb-data-api'
# The FULL connection string (incl. password) is the secret value — one per CONN_* key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appdb-data-api-conn
  namespace: appdb-data-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: appdb-data-api-conn      # ESO creates/updates a k8s Secret of this name
    creationPolicy: Owner
  data:
    - secretKey: CONN_GLOBAL_CONFIG
      remoteRef: { key: appdb-data-api/CONN_GLOBAL_CONFIG }
    - secretKey: CONN_ID_MSGDATA
      remoteRef: { key: appdb-data-api/CONN_ID_MSGDATA }
    # Uncomment when uk/us region sources are added to data-source-files:
    # - secretKey: CONN_UK_MSGDATA
    #   remoteRef: { key: appdb-data-api/CONN_UK_MSGDATA }
    # - secretKey: CONN_US_MSGDATA
    #   remoteRef: { key: appdb-data-api/CONN_US_MSGDATA }
    # OIDC issuer/audience. These are PUBLIC (not secrets) — dev/staging set them as plain env in
    # their deployment.yaml. Kept here for prod only as a convenience; you may move them to plain env too.
    - secretKey: AUTH_JWT_ISSUER
      remoteRef: { key: appdb-data-api/AUTH_JWT_ISSUER }
    - secretKey: AUTH_JWT_AUDIENCE
      remoteRef: { key: appdb-data-api/AUTH_JWT_AUDIENCE }
