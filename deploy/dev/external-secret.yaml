# DEV secret (AWS acct 111111111111). Create it first (single connection — dev is one DB):
#   aws secretsmanager create-secret --name appdb-data-api/dev/CONN_DEV --secret-string \
#     'Server=DEV-NODE1,1433;Database=AppDb_dev;User ID=svc_dataapi;Password=<dev-pwd>;ApplicationIntent=ReadOnly;Encrypt=True;TrustServerCertificate=False;Application Name=appdb-data-api'
# Prereq: External Secrets Operator + a ClusterSecretStore 'aws-secretsmanager' (IRSA) in the DEV cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appdb-data-api-conn
  namespace: appdb-data-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: appdb-data-api-conn
    creationPolicy: Owner
  data:
    - secretKey: CONN_DEV
      remoteRef: { key: appdb-data-api/dev/CONN_DEV }
