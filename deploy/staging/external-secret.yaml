# STAGING secrets (AWS acct 222222222222). Create them first (prod-shaped: two sources):
#   aws secretsmanager create-secret --name appdb-data-api/staging/CONN_GLOBAL_CONFIG --secret-string \
#     'Server=ag-staging-listener,1433;Database=AppCatalog;User ID=svc_dataapi;Password=<stg-pwd>;ApplicationIntent=ReadOnly;MultiSubnetFailover=True;Encrypt=True;TrustServerCertificate=False;Application Name=appdb-data-api'
#   aws secretsmanager create-secret --name appdb-data-api/staging/CONN_ID_MSGDATA --secret-string \
#     'Server=ag-staging-listener,1433;Database=AppDb_Data;User ID=svc_dataapi;Password=<stg-pwd>;ApplicationIntent=ReadOnly;MultiSubnetFailover=True;Encrypt=True;TrustServerCertificate=False;Application Name=appdb-data-api'
# Prereq: External Secrets Operator + a ClusterSecretStore 'aws-secretsmanager' (IRSA) in the STAGING cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appdb-data-api-conn
  namespace: appdb-data-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: appdb-data-api-conn
    creationPolicy: Owner
  data:
    - secretKey: CONN_GLOBAL_CONFIG
      remoteRef: { key: appdb-data-api/staging/CONN_GLOBAL_CONFIG }
    - secretKey: CONN_ID_MSGDATA
      remoteRef: { key: appdb-data-api/staging/CONN_ID_MSGDATA }
